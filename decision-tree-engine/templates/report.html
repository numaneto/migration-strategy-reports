<section id="__COMPONENT_ID__" class="migration-screening">
<style>
.migration-screening {font-family:"Segoe UI",Aptos,Calibri,sans-serif;background:var(--cp-bg);color:var(--cp-text);padding:24px;max-width:1440px;margin:auto}
.migration-screening * {box-sizing:border-box}
.migration-screening header {background:var(--cp-accent);color:var(--cp-accent-fg);padding:28px;border-radius:16px;margin-bottom:16px}
.migration-screening h1 {font-size:28px;margin-bottom:8px}
.migration-screening h2 {margin:16px 0;font-size:22px}
.migration-screening h3 {margin:12px 0}
.migration-screening p {margin:8px 0}
.migration-screening .tools {display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--cp-surface);padding:16px;border:1px solid var(--cp-border);border-radius:10px;position:sticky;top:0;z-index:3}
.migration-screening label {display:flex;gap:8px;align-items:center}
.migration-screening select,.migration-screening input,.migration-screening button {font:inherit;border:1px solid var(--cp-border-strong);border-radius:10px;padding:8px;background:var(--cp-surface);color:var(--cp-text)}
.migration-screening button {cursor:pointer}
.migration-screening button:focus-visible,.migration-screening summary:focus-visible {outline:2px solid var(--cp-link)}
.migration-screening .cards {display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}
.migration-screening .card,.migration-screening article {background:var(--cp-surface);border:1px solid var(--cp-border);border-radius:16px;padding:20px}
.migration-screening .card {flex:1;min-width:160px;border-top:4px solid var(--cp-accent)}
.migration-screening .card strong {display:block;font-size:30px}
.migration-screening article {margin:16px 0}
.migration-screening details {margin:8px 0;border-left:2px solid var(--cp-border);padding:8px 12px}
.migration-screening summary {cursor:pointer;color:var(--cp-link);font-weight:600}
.migration-screening .chips {display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.migration-screening .chip {background:var(--cp-surface-soft);border:1px solid var(--cp-border);border-radius:10px;padding:4px 8px}
.migration-screening .muted {color:var(--cp-text-muted)}
.migration-screening .notice {padding:12px;border-left:4px solid var(--cp-warning);background:var(--cp-surface-soft)}
.migration-screening a {color:var(--cp-link)}
.migration-screening table {border-collapse:collapse;width:100%;margin:12px 0}
.migration-screening td,.migration-screening th {padding:8px;text-align:left;border-bottom:1px solid var(--cp-border);vertical-align:top;overflow-wrap:anywhere}
.migration-screening .scroll {overflow:auto;max-height:700px}
.migration-screening .tree {transform-origin:top left;padding:8px}
.migration-screening .tree details {border-left:2px solid var(--cp-border);margin:8px 0 8px 12px}
.migration-screening .tree>.tree-root {margin-left:0;background:var(--cp-surface)}
.migration-screening .tree .status-ready {border-left-color:var(--cp-success)}
.migration-screening .tree .status-ready-conditions {border-left-color:var(--cp-warning)}
.migration-screening .tree .status-not-ready {border-left-color:var(--cp-danger)}
.migration-screening .tree .status-unknown {border-left-color:var(--cp-border-strong)}
.migration-screening .tree-controls {display:flex;gap:8px;margin:12px 0}
.migration-screening .card[aria-pressed="true"] {outline:2px solid var(--cp-accent)}
.migration-screening .card {text-align:left}
.migration-screening .vm-readiness table {min-width:900px}
.migration-screening .vm-name {font-weight:600}
.migration-screening .vm-tags {display:block;font-size:12px;color:var(--cp-text-muted)}
.migration-screening .rule-detail {padding:8px;margin:8px 0;border:1px solid var(--cp-border);border-radius:10px}
.migration-screening [hidden] {display:none!important}
.migration-screening .status-not-ready {border-top-color:var(--cp-danger)}
.migration-screening .status-unknown {border-top-color:var(--cp-border-strong)}
.migration-screening .status-ready-conditions {border-top-color:var(--cp-warning)}
.migration-screening .status-ready {border-top-color:var(--cp-success)}
.migration-screening .flow {padding:8px;background:var(--cp-surface-soft);margin:4px 0;border-radius:10px}
.migration-screening footer {padding:16px;border-top:1px solid var(--cp-border);color:var(--cp-text-muted)}
@media(max-width:700px) {.migration-screening{padding:12px}.migration-screening .tools{position:static}.migration-screening h1{font-size:22px}}
@media print {.migration-screening .tools{position:static}.migration-screening button,.migration-screening input{display:none}.migration-screening .scroll{max-height:none;overflow:visible}.migration-screening .tree{display:block;transform:none!important;width:auto}.migration-screening article{break-inside:avoid}}
</style>
<header><h1 data-label="title"></h1><p class="customer"></p><p data-label="purpose"></p></header>
<div class="tools">
<label><span data-label="language"></span><select class="language"><option value="0">English</option><option value="1">Português (Brasil)</option><option value="2">Español</option></select></label>
<label><span data-label="scenario"></span><select class="scenario"></select></label>
<label><span data-label="status"></span><select class="status-filter"><option value="all" data-label="allVms"></option><option value="ready" data-label="ready"></option><option value="ready-conditions" data-label="ready-conditions"></option><option value="not-ready" data-label="not-ready"></option><option value="unknown" data-label="unknown"></option></select></label>
<label><span data-label="view"></span><select class="view"><option value="list" data-label="list"></option><option value="tree" data-label="mindmap"></option></select></label>
<label><span data-label="group"></span><select class="group"><option value="issue" data-label="issue"></option><option value="action" data-label="action"></option></select></label>
<label><span data-label="search"></span><input class="search" type="search"></label>
<label><span data-label="zoom"></span><input class="zoom" type="range" min="60" max="150" value="100"></label>
<button class="export" data-label="export"></button>
<button class="export-vms" data-label="exportVms"></button>
<button class="clear-filters" data-label="clearFilters"></button>
</div>
<p class="notice disclosure"></p>
<div class="cards"></div>
<article class="vm-explorer"><h2 data-label="vmReadiness"></h2><p data-label="readinessNotice" class="notice"></p><p data-label="filterNotice" class="muted"></p><p class="vm-count" role="status" aria-live="polite"></p><div class="vm-readiness scroll"></div><div class="tree-controls" hidden><button class="expand-all" data-label="expandAll"></button><button class="collapse-all" data-label="collapseAll"></button></div><p data-label="groupNotice" class="group-notice muted" hidden></p><div class="issues" hidden></div></article>
<article><h2 data-label="services"></h2><p data-label="serviceNotice" class="notice"></p><div class="service-data"></div></article>
<article><h2 data-label="network"></h2><p data-label="networkNotice" class="notice"></p><div class="network-data"></div></article>
<article><h2 data-label="dependencies"></h2><p data-label="dependencyNotice" class="notice"></p><div class="flows"></div></article>
<article><h2 data-label="waves"></h2><p data-label="waveNotice" class="notice"></p><div class="waves"></div></article>
<article><h2 data-label="sources"></h2><div class="sources"></div></article>
<footer><span class="customer"></span> · <span data-label="footer"></span></footer>
<script>
(() => {
  "use strict";
  const root = document.getElementById("__COMPONENT_ID__");
  const data = __PAYLOAD__;
  const labels = {
    title:["Migration readiness & remediation","Prontidão e remediação de migração","Preparación y corrección de migración"],
    purpose:["Evidence-based restrictions, remediation and candidate move groups","Restrições, remediação e grupos candidatos baseados em evidências","Restricciones, corrección y grupos candidatos basados en evidencia"],
    language:["Language","Idioma","Idioma"],scenario:["Scenario","Cenário","Escenario"],
    status:["Status","Status","Estado"],
    view:["View","Visualização","Vista"],list:["VM list","Lista de VMs","Lista de VM"],
    mindmap:["Nested action tree","Árvore aninhada de ações","Árbol anidado de acciones"],group:["Group by","Agrupar por","Agrupar por"],
    issue:["Issue","Problema","Problema"],action:["Remediation action","Ação de remediação","Acción correctiva"],
    search:["Search VMs / issues","Buscar VMs / problemas","Buscar VM / problemas"],zoom:["Zoom","Zoom","Zoom"],
    export:["Export filtered actions (CSV)","Exportar ações filtradas (CSV)","Exportar acciones filtradas (CSV)"],
    exportVms:["Export filtered VMs (CSV)","Exportar VMs filtradas (CSV)","Exportar VM filtradas (CSV)"],
    allVms:["All VMs","Todas as VMs","Todas las VM"],
    clearFilters:["Clear filters","Limpar filtros","Limpiar filtros"],
    expandAll:["Expand all","Expandir tudo","Expandir todo"],collapseAll:["Collapse all","Recolher tudo","Contraer todo"],
    showing:["Showing","Exibindo","Mostrando"],of:["of","de","de"],
    filterNotice:["Filters apply to this VM explorer and its CSV exports. Counts use unique VMs within the selected migration scope. Service, network, dependency and wave evidence below retains full-scope context.","Filtros aplicam-se a este explorador de VMs e seus CSVs. Contagens usam VMs únicas no escopo de migração selecionado. Evidências de serviços, rede, dependências e ondas abaixo mantêm o contexto completo.","Los filtros se aplican a este explorador de VM y sus CSV. Los recuentos usan VM únicas del alcance de migración seleccionado. La evidencia de servicios, red, dependencias y oleadas conserva el contexto completo."],
    condition:["Condition / next action","Condição / próxima ação","Condición / próxima acción"],
    furtherChecks:["Additional execution / network / delivery checks","Validações adicionais de execução / rede / entrega","Validaciones adicionales de ejecución / red / entrega"],
    remediation:["Restrictions and actionable remediation","Restrições e remediação acionável","Restricciones y corrección accionable"],
    groupNotice:["A VM can have multiple issues; issue totals are not unique VM totals. These groups are not application dependencies.","Uma VM pode ter vários problemas; somas por problema não são VMs únicas. Estes grupos não são dependências de aplicações.","Una VM puede tener varios problemas; los totales por problema no son VM únicas. Estos grupos no son dependencias de aplicaciones."],
    hypothesis:["CALIBRATION: four hypothetical scenarios, not approved customer plans.","CALIBRAÇÃO: quatro cenários hipotéticos, não planos aprovados pelo cliente.","CALIBRACIÓN: cuatro escenarios hipotéticos, no planes aprobados por el cliente."],
    engagement:["Screening only. Confirm source, target, method, regions and IP retention with the operator before delivery.","Triagem. Confirmar origem, destino, método, regiões e preservação de IP com o operador antes da entrega.","Análisis preliminar. Confirmar origen, destino, método, regiones y conservación de IP con el operador antes de entregar."],
    synthetic:["Synthetic test data.","Dados sintéticos de teste.","Datos sintéticos de prueba."],
    sanitized:["Sanitized Contoso observations; no real customer identity retained.","Observações anonimizadas Contoso; sem identidade real do cliente.","Observaciones anonimizadas Contoso; sin identidad real del cliente."],
    "not-ready":["Not ready for selected method","Não pronta para o método","No preparada para el método"],
    "ready-conditions":["Ready with conditions","Pronta com condições","Preparada con condiciones"],
    unknown:["Pending — evidence/support unresolved","Pendente — evidência/suporte não resolvido","Pendiente — evidencia/soporte sin resolver"],ready:["Ready — preliminary OS compatibility","Pronta — compatibilidade preliminar do SO","Preparada — compatibilidad preliminar del SO"],
    vmReadiness:["VM explorer V1 — readiness, conditions & actions","Explorador de VMs V1 — prontidão, condições e ações","Explorador de VM V1 — preparación, condiciones y acciones"],
    readinessNotice:["Declared OS/version and the selected method's official matrix establish preliminary readiness. Known blockers and lifecycle restrictions override it; missing or inconclusive support is Pending. Routine network/sizing/preflight gaps remain execution gates, not blanket OS-readiness downgrades. Ready is not authorization to cut over.","SO/versão declarados e matriz oficial do método estabelecem prontidão preliminar. Bloqueios e restrições de ciclo de vida prevalecem; suporte ausente ou inconclusivo fica Pendente. Lacunas rotineiras de rede/sizing/pré-validação são gates de execução, não rebaixamento geral da prontidão pelo SO. Pronta não autoriza corte.","SO/versión declarados y matriz oficial del método establecen preparación preliminar. Bloqueos y restricciones de ciclo de vida prevalecen; soporte ausente o inconcluso queda Pendiente. Las brechas rutinarias de red/dimensionamiento/validación son controles de ejecución, no degradación general por SO. Preparada no autoriza el corte."],
    basis:["Readiness basis","Base da prontidão","Base de preparación"],tags:["Role / delivery tags","Tags de papel / entrega","Etiquetas de rol / entrega"],
    "os-support":["Declared OS / official support matrix","SO declarado / matriz oficial de suporte","SO declarado / matriz oficial de soporte"],
    assessment:["Explicit assessment finding","Achado explícito do assessment","Hallazgo explícito de evaluación"],
    "pending-evidence":["Support/evidence resolution required","Resolver suporte/evidências","Resolver soporte/evidencia"],
    preflight:["Separate execution / delivery gate","Gate separado de execução / entrega","Control separado de ejecución / entrega"],
    services:["Service identification — declarations versus port hints","Identificação de serviços — declarações versus indícios de portas","Identificación de servicios — declaraciones frente a indicios de puertos"],
    serviceNotice:["Correlate hosted-application, solution, database and role fields with declared ports. Port-only matches are low-confidence hypotheses: they may represent client dependencies or copied boilerplate. They do not prove a hosted service, TCP/UDP, direction, listeners or endpoint relationships. Explicit domain controllers carry DOMAIN-CONTROLLER and FACTORY-EXCLUDED tags: Factory does not migrate them. This is delivery policy, not Azure incompatibility.","Correlacionar aplicações hospedadas, solução, banco e papel com portas declaradas. Portas isoladas são hipóteses de baixa confiança: podem representar dependências cliente ou listas copiadas. Não comprovam serviço hospedado, TCP/UDP, direção, listeners ou endpoints. Controladores explícitos recebem DOMAIN-CONTROLLER e FACTORY-EXCLUDED: a Factory não os migra. É política de entrega, não incompatibilidade Azure.","Correlacionar aplicaciones alojadas, solución, base de datos y rol con puertos declarados. Los puertos aislados son hipótesis de baja confianza: pueden ser dependencias cliente o listas copiadas. No prueban servicio alojado, TCP/UDP, dirección, listeners ni endpoints. Controladores explícitos reciben DOMAIN-CONTROLLER y FACTORY-EXCLUDED: Factory no los migra. Es política de entrega, no incompatibilidad Azure."],
    service:["Service / hypothesis","Serviço / hipótese","Servicio / hipótesis"],confidence:["Confidence","Confiança","Confianza"],
    high:["High","Alta","Alta"],medium:["Medium","Média","Media"],low:["Low","Baixa","Baja"],
    "declared-and-ports":["Declared service + matching default ports","Serviço declarado + portas padrão correspondentes","Servicio declarado + puertos predeterminados coincidentes"],
    declared:["Declared in hosted-service fields","Declarado nos campos de serviços hospedados","Declarado en campos de servicios alojados"],
    "port-hint":["Port hint only — hosted role unconfirmed","Apenas indício de porta — papel hospedado não confirmado","Solo indicio de puerto — rol alojado sin confirmar"],
    portMatches:["Matching port tokens","Portas correspondentes","Puertos coincidentes"],
    "scope-review":["Delivery scope approval pending","Aprovação do escopo de entrega pendente","Aprobación del alcance de entrega pendiente"],
    factoryExcluded:["Factory excluded — customer / ISD / partner","Fora da Factory — cliente / ISD / parceiro","Fuera de Factory — cliente / ISD / socio"],
    owner:["Proposed responsible party","Responsável proposto","Responsable propuesto"],exit:["Exit criterion","Critério de saída","Criterio de salida"],
    "customer-partner":["Customer / partner / vendor; confirm assignment","Cliente / parceiro / fornecedor; confirmar atribuição","Cliente / socio / proveedor; confirmar asignación"],
    network:["Network & addressing evidence","Rede e evidências de endereçamento","Red y evidencia de direccionamiento"],
    networkNotice:["Compare IP preservation with isolated routing / re-IP / NAT. Confirm DNS, routes, NSG/firewall and cutover. Bare IPs do not imply /24. Cross-scope overlap is a consolidation risk, not automatic impossibility.","Comparar preservação de IP com roteamento isolado / re-IP / NAT. Confirmar DNS, rotas, NSG/firewall e corte. IPs não implicam /24. Sobreposição entre escopos é risco de consolidação, não impossibilidade automática.","Comparar conservación de IP con enrutamiento aislado / renumeración / NAT. Confirmar DNS, rutas, NSG/firewall y corte. Las IP no implican /24. Solapamiento entre ámbitos es riesgo de consolidación, no imposibilidad automática."],
    duplicates:["Duplicate IPs (same scope)","IPs duplicados (mesmo escopo)","IP duplicadas (mismo ámbito)"],
    overlaps:["Potential CIDR overlaps (different scopes)","Possíveis sobreposições CIDR (escopos distintos)","Posibles solapamientos CIDR (ámbitos distintos)"],
    missing:["VMs with incomplete addressing","VMs com endereçamento incompleto","VM con direccionamiento incompleto"],
    scope:["Routing scope","Escopo de roteamento","Ámbito de enrutamiento"],segment:["Segment / VLAN","Segmento / VLAN","Segmento / VLAN"],
    unavailable:["Not available","Não disponível","No disponible"],
    dependencies:["Observed / declared dependency map","Mapa de dependências observadas / declaradas","Mapa de dependencias observadas / declaradas"],
    dependencyNotice:["Only explicit endpoints create edges. TCP/UDP and ports are shown when supplied. Azure Migrate agentless discovery captures TCP, not UDP; absent edges do not prove independence.","Somente endpoints explícitos criam conexões. TCP/UDP e portas aparecem quando fornecidos. Descoberta sem agente do Azure Migrate captura TCP, não UDP; ausência de conexões não prova independência.","Solo endpoints explícitos crean conexiones. TCP/UDP y puertos se muestran si existen. El descubrimiento sin agente de Azure Migrate captura TCP, no UDP; ausencia de conexiones no prueba independencia."],
    noFlows:["No explicit flows supplied: collect dependencies before approving waves.","Sem fluxos explícitos: coletar dependências antes de aprovar ondas.","Sin flujos explícitos: recopilar dependencias antes de aprobar oleadas."],
    unresolved:["Unresolved endpoints","Endpoints não resolvidos","Endpoints sin resolver"],
    waves:["Candidate move groups & wave gates","Grupos candidatos e gates de ondas","Grupos candidatos y controles de oleadas"],
    waveNotice:["Connected components are review candidates, not a schedule. Shared services may join many apps: validate grouping, ownership, RTO/RPO, capacity, downtime, rollback and security before pilot/production waves.","Componentes conectados são candidatos à revisão, não cronograma. Serviços compartilhados podem unir aplicações: validar grupos, responsáveis, RTO/RPO, capacidade, parada, rollback e segurança antes das ondas.","Los componentes conectados son candidatos de revisión, no un calendario. Servicios compartidos pueden unir aplicaciones: validar grupos, responsables, RTO/RPO, capacidad, parada, reversión y seguridad antes de oleadas."],
    hold:["Hold: resolve pending support, blockers, delivery ownership and external endpoints","Aguardar: resolver suporte pendente, bloqueios, responsabilidade e endpoints externos","Esperar: resolver soporte pendiente, bloqueos, responsabilidad y endpoints externos"],
    validate:["Candidate: validate conditions before pilot","Candidato: validar condições antes do piloto","Candidato: validar condiciones antes del piloto"],
    noEdges:["No known edges; dependency evidence incomplete","Sem conexões conhecidas; evidência incompleta","Sin conexiones conocidas; evidencia incompleta"],
    sources:["Official reference register","Registro de referências oficiais","Registro de referencias oficiales"],
    sourceNotice:["Revalidate official sources before each engagement. Reviewed on: ","Revalidar fontes oficiais antes de cada entrega. Revisadas em: ","Revalidar fuentes oficiales antes de cada entrega. Revisadas el: "],
    evidence:["Evidence","Evidência","Evidencia"],reference:["Official reference","Referência oficial","Referencia oficial"],
    footer:["Report generated by AI Skill - Should be reviewed by your CFTL or Architect.","Relatório gerado por Skill de IA - Deve ser revisado pelo seu CFTL ou Arquiteto.","Informe generado por Skill de IA - Debe ser revisado por su CFTL o Arquitecto."],
    noIssues:["No detected restrictions in the available evidence.","Nenhuma restrição detectada nas evidências disponíveis.","Sin restricciones detectadas en la evidencia disponible."],
    noMatches:["No matching VM / issue.","Nenhuma VM / problema correspondente.","Ninguna VM / problema coincidente."],
    declaredPorts:["Declared ports (no endpoint relationship implied)","Portas declaradas (sem inferir relação entre endpoints)","Puertos declarados (sin inferir relación entre endpoints)"],
    inventory:["Inventory evidence","Evidências do inventário","Evidencia del inventario"],
    os:["Operating system","Sistema operacional","Sistema operativo"],
    disk:["Total disk (GB), not OS disk","Disco total (GB), não disco de SO","Disco total (GB), no disco de SO"],
    coverage:["Data coverage","Cobertura dos dados","Cobertura de datos"],
    unsupported:["Tables requiring manual review","Tabelas que exigem revisão manual","Tablas que requieren revisión manual"],
    networkOwner:["Customer / partner network team","Equipe de rede do cliente / parceiro","Equipo de red del cliente / socio"]
  };
  const q = selector => root.querySelector(selector);
  let lang = 0;
  try {lang = Number(localStorage.getItem("migration-report-language") || 0);} catch (error) {
    console.warn("Language preference storage unavailable", error);
  }
  if (![0,1,2].includes(lang)) lang = 0;
  const t = key => labels[key][lang];
  const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const rows = entries => `<table><tbody>${entries.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  const refLinks = (rule, scenario) => rule.refs.filter(key => data.sources.sources[key].scenarios.includes(scenario))
    .map(key => `<a href="${esc(data.sources.sources[key].url)}" target="_blank" rel="noopener noreferrer">${esc(t("reference"))}</a>`).join(" · ");
  const inventoryById = new Map(data.inventory.vms.map(vm => [vm.id,vm]));
  const statusOrder = ["ready","ready-conditions","unknown","not-ready"];
  const osLabel = vm => [...new Set(inventoryById.get(vm.id).observations.map(o => [o.os,o.os_version].filter(Boolean).join(" ")).filter(Boolean))].join(" / ") || t("unavailable");
  function primaryIssues(vm) {
    const drivers = vm.issues.filter(id => data.taxonomy[id].affects_readiness !== false && data.taxonomy[id].status === vm.status);
    const specific = drivers.filter(id => id !== "assessment-gap");
    return specific.length ? specific : drivers;
  }
  function selectedVms() {
    const term = q(".search").value.trim().toLocaleLowerCase(), status = q(".status-filter").value;
    return data.reports[q(".scenario").value].vms.filter(vm => {
      if (status !== "all" && vm.status !== status) return false;
      const fields = [vm.name,osLabel(vm),...vm.tags,t(vm.status),t(vm.basis),
        ...vm.issues.flatMap(id => [data.taxonomy[id].title[lang],data.taxonomy[id].action[lang],data.taxonomy[id].exit[lang]]),
        ...data.services[vm.id].services.map(s => s.label[lang])];
      return !term || fields.some(value => value.toLocaleLowerCase().includes(term));
    });
  }
  function ruleDetail(id, scenario) {
    const rule = data.taxonomy[id];
    return `<div class="rule-detail"><b>${esc(rule.title[lang])}</b><p>${esc(t(rule.affects_readiness === false ? "preflight" : rule.status))}</p>` +
      `<p><b>${esc(t("action"))}:</b> ${esc(rule.action[lang])}</p><p><b>${esc(t("exit"))}:</b> ${esc(rule.exit[lang])}</p>` +
      `<p><b>${esc(t("owner"))}:</b> ${esc(t(rule.scope === "network" ? "networkOwner" : "customer-partner"))}</p><p>${refLinks(rule,scenario)}</p></div>`;
  }
  function vmDetail(vm, scenario) {
    const primary = primaryIssues(vm), additional = vm.issues.filter(id => !primary.includes(id));
    return primary.map(id => ruleDetail(id,scenario)).join("") +
      (additional.length ? `<details class="additional-checks"><summary>${esc(t("furtherChecks"))} (${additional.length})</summary>${additional.map(id => ruleDetail(id,scenario)).join("")}</details>` : "") +
      `<p><b>${esc(t("evidence"))}:</b> ${esc(vm.evidence.map(e => `${e.source} · ${e.sheet} · ${e.row}`).join("; "))}</p>`;
  }
  function renderExplorer(scenario, report) {
    const selected = selectedVms(), tree = q(".view").value === "tree";
    q(".vm-count").textContent = `${t("showing")} ${selected.length} ${t("of")} ${report.vms.length} VMs`;
    q(".vm-readiness").hidden = tree;
    q(".tree-controls").hidden = !tree;
    q(".group-notice").hidden = !tree;
    q(".issues").hidden = !tree;
    q(".group").disabled = !tree;
    q(".zoom").disabled = !tree;
    const headings = ["VM",t("os"),t("status"),t("condition"),t("owner")];
    q(".vm-readiness").innerHTML = `<table><thead><tr>${headings.map(h => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead><tbody>` +
      selected.map(vm => `<tr data-vm-id="${esc(vm.id)}"><td><span class="vm-name">${esc(vm.name)}</span><span class="vm-tags">${esc(vm.tags.join(" · "))}</span></td>` +
        `<td>${esc(osLabel(vm))}</td><td>${esc(t(vm.status))}<p class="muted">${esc(t(vm.basis))}</p></td>` +
        `<td><details class="vm-actions"><summary>${esc(primaryIssues(vm).map(id => data.taxonomy[id].title[lang]).join("; ") || t("furtherChecks"))}</summary>${vmDetail(vm,scenario)}</details></td>` +
        `<td>${esc(t(data.services[vm.id].factory_excluded ? "factoryExcluded" : vm.delivery_owner))}</td></tr>`).join("") +
      `</tbody></table>${selected.length ? "" : `<p>${esc(t("noMatches"))}</p>`}`;
    if (!tree) {q(".issues").replaceChildren();return;}
    const branches = statusOrder.filter(status => q(".status-filter").value === "all" || q(".status-filter").value === status).map(status => {
      const members = selected.filter(vm => vm.status === status), groups = new Map();
      members.forEach(vm => primaryIssues(vm).forEach(id => {
        const rule = data.taxonomy[id], key = q(".group").value === "action" ? rule.action[lang] : id;
        if (!groups.has(key)) groups.set(key,{rules:new Set(),vms:new Map()});
        groups.get(key).rules.add(id);groups.get(key).vms.set(vm.id,vm);
      }));
      const actions = [...groups.values()].map(group => {
        const ids = [...group.rules], rule = data.taxonomy[ids[0]], title = q(".group").value === "action" ? rule.action[lang] : rule.title[lang];
        return `<details class="action-branch"><summary>${esc(title)} (${group.vms.size})</summary>${ids.map(id => ruleDetail(id,scenario)).join("")}` +
          [...group.vms.values()].map(vm => `<details class="vm-leaf" data-vm-id="${esc(vm.id)}"><summary>${esc(vm.name)}${vm.tags.length ? " · " + esc(vm.tags.join(" · ")) : ""}</summary><p>${esc(osLabel(vm))} · ${esc(t(vm.status))}</p>${vmDetail(vm,scenario)}</details>`).join("") + "</details>";
      }).join("");
      return `<details class="status-branch status-${status}" data-status="${status}" open><summary>${esc(t(status))} (${members.length})</summary>${actions || `<p>${esc(t("noMatches"))}</p>`}</details>`;
    }).join("");
    q(".issues").innerHTML = `<div class="scroll"><div class="tree"><details class="tree-root" open><summary>${esc(t("allVms"))} (${selected.length})</summary>${branches}</details></div></div>`;
    q(".tree").style.zoom = `${q(".zoom").value}%`;
  }
  Object.keys(data.reports).forEach(key => {
    const option = document.createElement("option"); option.value = key; option.textContent = data.scenarios[key]; q(".scenario").append(option);
  });
  q(".language").value = String(lang);
  function render() {
    const scenario = q(".scenario").value, report = data.reports[scenario];
    root.lang = ["en","pt-BR","es"][lang];
    if (root.parentElement === document.body) document.documentElement.lang = root.lang;
    if (root.parentElement === document.body) document.title = data.customer + " · " + t("title");
    root.querySelectorAll("[data-label]").forEach(node => node.textContent = t(node.dataset.label));
    root.querySelectorAll(".customer").forEach(node => node.textContent = data.customer);
    q(".search").setAttribute("aria-label", t("search")); q(".zoom").setAttribute("aria-label", t("zoom"));
    q(".disclosure").textContent = t(data.hypotheses ? "hypothesis" : "engagement") + " " + (data.input_kind === "synthetic" ? t("synthetic") : data.input_kind === "sanitized-observations" ? t("sanitized") : "");
    q(".cards").innerHTML = ["not-ready","ready-conditions","unknown","ready"].map(s => `<button type="button" class="card status-${s}" data-status="${s}" aria-pressed="${q(".status-filter").value === s}"><strong>${report.counts[s] || 0}</strong>${esc(t(s))}</button>`).join("");
    renderExplorer(scenario,report);
    q(".service-data").innerHTML = data.inventory.vms.flatMap(vm => {
      const analysis = data.services[vm.id];
      const findings = analysis.services;
      if (!findings.length) return [];
      return [`<details><summary>${esc(vm.name)} · ${esc(analysis.tags.join(" · ") || findings.map(s => s.label[lang]).join(" / "))}</summary>` +
        rows([[esc(t("service")),esc(t("confidence")),esc(t("basis")),esc(t("portMatches")),esc(t("evidence")),esc(t("reference"))],
          ...findings.map(s => [esc(s.label[lang]),esc(t(s.confidence)),esc(t(s.basis)),esc(s.matched_ports.join(", ") || t("unavailable")),
            esc(s.evidence.map(e => e.field + ": " + e.value).join(" · ") || t("port-hint")),refLinks(s,scenario)])]) + "</details>"];
    }).join("") || `<p>${esc(t("noMatches"))}</p>`;
    const net = data.network;
    const inventoryValue = (vm, field) => [...new Set(vm.observations.filter(o => o[field] !== undefined).map(o => String(o[field]) === "Unknown" ? t("unavailable") : String(o[field])))].join(" / ") || t("unavailable");
    q(".network-data").innerHTML = `<p>${esc(t("duplicates"))}: ${net.duplicates.length} · ${esc(t("overlaps"))}: ${net.overlaps.length} · ${esc(t("missing"))}: ${net.incomplete.length}</p>` +
      rows(net.duplicates.map(d => [esc(d.scope),esc(d.ip),esc(d.vms.join(", "))])) +
      rows(net.overlaps.map(d => [esc(d.scopes.join(" ↔ ")),esc(d.cidrs.join(" ↔ "))])) +
      `<details><summary>${esc(t("network"))}</summary><div class="scroll">` +
      rows([[esc("VM"),esc(t("scope")),esc("IP / CIDR"),esc(t("segment"))],
        ...data.inventory.vms.flatMap(vm => vm.networks.map(n => [esc(vm.name),esc(vm.scope),esc([...n.ips,n.cidr || t("unavailable")].join(" · ")),esc([n.segment || t("unavailable"),n.vlan || t("unavailable")].join(" / "))]))]) + "</div></details>" +
      `<details><summary>${esc(t("declaredPorts"))}</summary>` +
      rows(data.inventory.vms.filter(vm => vm.declared_ports?.length).map(vm => [esc(vm.name),esc(vm.declared_ports.join("; "))])) + "</details>" +
      `<details><summary>${esc(t("inventory"))}</summary><div class="scroll">` +
      rows([["VM",esc(t("os")),"vCPU","RAM (GB)",esc(t("disk")),"Hypervisor"],
        ...data.inventory.vms.map(vm => [esc(vm.name),esc(inventoryValue(vm,"os")),esc(inventoryValue(vm,"cpu")),esc(inventoryValue(vm,"ram_gb")),esc(inventoryValue(vm,"total_disk_gb")),esc(inventoryValue(vm,"hypervisor"))])]) + "</div></details>";
    q(".flows").innerHTML = data.inventory.flows.length ? data.inventory.flows.map(f => `<div class="flow">${esc(f.source)} → ${esc(f.destination)} · ${esc(f.protocol)} / ${esc(f.port || t("unavailable"))}</div>`).join("") : `<p>${esc(t("noFlows"))}</p>`;
    q(".flows").innerHTML += `<p>${esc(t("unresolved"))}: ${report.planning.unresolved.length}</p>`;
    q(".waves").innerHTML = `<div class="scroll">${report.planning.groups.map(g => `<details><summary>${esc(g.id)} · ${esc(t(g.gate))} (${g.vms.length})</summary><p>${esc(g.vms.join(", "))}</p>${g.basis === "no-known-edges" ? `<p>${esc(t("noEdges"))}</p>` : ""}</details>`).join("")}</div>`;
    q(".sources").innerHTML = `<p>${esc(t("sourceNotice") + data.sources.reviewed_on)}</p>` +
      Object.values(data.sources.sources).filter(s => s.scenarios.includes(scenario)).map(s => `<p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(t("reference"))}</a> · ${esc(s.url)}</p>`).join("") +
      `<h3>${esc(t("coverage"))}</h3><p>${esc(t("unsupported"))}: ${data.inventory.coverage.filter(c => c.disposition === "review-required").length}</p>`;
  }
  q(".language").addEventListener("change", () => {
    lang = Number(q(".language").value);
    try {localStorage.setItem("migration-report-language", String(lang));} catch (error) {console.warn("Language preference not persisted",error);}
    render();
    root.dispatchEvent(new CustomEvent("migration-report-language", {bubbles:true,detail:{language:["en","pt-BR","es"][lang]}}));
  });
  window.addEventListener("migration-report-language", event => {
    const next = ["en","pt-BR","es"].indexOf(event.detail?.language);
    if (next < 0) {console.error("Unsupported report language event",event.detail);return;}
    if (next !== lang) {lang = next;q(".language").value = String(lang);render();}
  });
  [".scenario",".view",".group",".status-filter"].forEach(selector => q(selector).addEventListener("change",render));
  q(".cards").addEventListener("click", event => {
    const card = event.target.closest("[data-status]");
    if (card) {q(".status-filter").value = card.dataset.status;render();}
  });
  q(".clear-filters").addEventListener("click", () => {q(".status-filter").value = "all";q(".search").value = "";render();});
  [".expand-all",".collapse-all"].forEach(selector => q(selector).addEventListener("click", () => {
    root.querySelectorAll(".tree details").forEach(node => node.open = selector === ".expand-all");
  }));
  q(".search").addEventListener("input",render);
  q(".zoom").addEventListener("input",() => {if (q(".tree")) q(".tree").style.zoom = `${q(".zoom").value}%`;});
  q(".export").addEventListener("click", () => {
    const scenario = q(".scenario").value;
    const records = [[t("scenario"),"VM",t("status"),t("issue"),t("action"),t("owner"),t("exit"),t("reference"),t("tags"),t("basis")]];
    selectedVms().forEach(vm => vm.issues.forEach(id => {
      const rule = data.taxonomy[id];
      records.push([data.scenarios[scenario],vm.name,t(vm.status),rule.title[lang],rule.action[lang],
        rule.scope === "network" ? t("networkOwner") : t("customer-partner"),rule.exit[lang],
        rule.refs.filter(k => data.sources.sources[k].scenarios.includes(scenario)).map(k => data.sources.sources[k].url).join(" "),vm.tags.join("; "),t(vm.basis)]);
    }));
    downloadCsv(records,"Actions");
  });
  q(".export-vms").addEventListener("click", () => {
    const scenario = q(".scenario").value;
    const records = [["VM",t("os"),t("status"),t("condition"),t("action"),t("tags"),t("reference")],
      ...selectedVms().map(vm => [vm.name,osLabel(vm),t(vm.status),
        primaryIssues(vm).map(id => data.taxonomy[id].title[lang]).join("; "),
        vm.issues.map(id => data.taxonomy[id].action[lang]).join("\n"),vm.tags.join("; "),
        [...new Set(vm.issues.flatMap(id => data.taxonomy[id].refs.filter(key => data.sources.sources[key].scenarios.includes(scenario)).map(key => data.sources.sources[key].url)))].join(" ")])];
    downloadCsv(records,"VMs");
  });
  function downloadCsv(records, kind) {
    const cell = value => {
      const raw = String(value); const safe = /^[=+\-@\t\r]/.test(raw) ? "'" + raw : raw;
      return '"' + safe.replace(/"/g,'""') + '"';
    };
    const blob = new Blob(["\uFEFF" + records.map(r => r.map(cell).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});
    const link = document.createElement("a"); const url = URL.createObjectURL(blob);
    link.href = url; link.download = "Migration_" + kind + "_" + q(".scenario").value + "_" + q(".status-filter").value + "_" + ["EN","PT-BR","ES"][lang] + ".csv"; link.click();
    setTimeout(() => URL.revokeObjectURL(url),1000);
  }
  render();
})();
</script>
</section>
